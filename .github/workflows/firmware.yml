name: firmware

# Builds the ESP-IDF firmware from the tracked sdkconfig.defaults only (empty Wi-Fi/Gemini
# fields), fails on any compiler warning, and uploads the flashable images.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5
    defaults:
      run:
        shell: bash
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4

      - name: Build (esp32s3)
        run: |
          # The checkout is owned by another uid inside the container; the IDF build runs
          # `git describe` for the app version.
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build 2>&1 | tee build/build.log

      - name: Fail on warnings (--strict-warnings)
        run: |
          if grep -Ei '(^|[^[:alpha:]])warning:' build/build.log; then
            echo "::error::The firmware build produced warnings (listed above)."
            exit 1
          fi

      - name: Size report
        run: |
          . "$IDF_PATH/export.sh"
          idf.py size | tee build/size.txt
          {
            echo '### Firmware size'
            echo '```'
            cat build/size.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            firmware/build/*.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args
            firmware/build/flasher_args.json
            firmware/build/build.log
          if-no-files-found: error
          retention-days: 30
