name: tests

# Host unit tests (doctest, ASan + UBSan) and a short libFuzzer run for the portable
# firmware/components/core/ code. See tests/README.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          # Runner images ship Ninja; only fetch it if missing. "apt-get update" has been
          # failing on these runners (exit code 100), so a failed update doesn't stop the
          # install from trying with the image's own package lists.
          if ! command -v ninja; then
            for attempt in 1 2 3; do
              sudo apt-get update || true
              sudo apt-get install -y ninja-build && break
              sleep $((attempt * 15))
            done
          fi
          command -v ninja
      - name: Configure
        run: cmake -S tests -B build/tests -G Ninja
      - name: Build
        run: cmake --build build/tests
      - name: Run (unit tests + screen gallery golden check)
        run: ctest --test-dir build/tests --output-on-failure
      - name: Board test tools (host side, no board needed)
        run: python3 -m unittest discover -s tools/board/tests -v
      - name: Release tools (the update manifest, #40)
        run: python3 -m unittest discover -s tools/release/tests -v
      - name: Photo prepare tool (#136)
        run: |
          python3 -m pip install --quiet "pillow>=10"
          python3 -m unittest discover -s tools/photos/tests -v

      - name: Upload screen gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screen-gallery-${{ github.sha }}
          path: build/tests/gallery/*.png
          if-no-files-found: ignore
          retention-days: 30

  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang + sanitizer runtimes
        run: |
          # Use what the runner image already has when a tiny fuzzer links with clang-18;
          # otherwise install, tolerating a failing "apt-get update" (exit code 100 on these
          # runners) and retrying.
          probe() {
            command -v ninja >/dev/null && command -v clang++-18 >/dev/null &&
              printf 'extern "C" int LLVMFuzzerTestOneInput(const unsigned char*, unsigned long) { return 0; }\n' |
              clang++-18 -x c++ -fsanitize=fuzzer,address,undefined - -o "$RUNNER_TEMP/probe"
          }
          if ! probe; then
            for attempt in 1 2 3; do
              sudo apt-get update || true
              sudo apt-get install -y ninja-build clang-18 libclang-rt-18-dev && break
              sleep $((attempt * 15))
            done
            probe
          fi
      - name: Build fuzzers
        run: |
          cmake -S tests -B build/fuzz -G Ninja -DKEEPSAKE_FUZZ=ON \
            -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build/fuzz
      - name: Fuzz (60 s per target)
        run: |
          mkdir -p build/fuzz/findings build/fuzz/corpus/fuzz_epub_book
          # Start the whole-book fuzzer from the generated test shelf (valid EPUB structure).
          cp build/fuzz/fixtures/*.epub build/fuzz/corpus/fuzz_epub_book/
          status=0
          for target in build/fuzz/fuzz_*; do
            [ -x "$target" ] || continue
            name=$(basename "$target")
            echo "::group::$name"
            mkdir -p "build/fuzz/corpus/$name"
            "$target" -max_total_time=60 -max_len=4096 \
              -artifact_prefix="build/fuzz/findings/$name-" "build/fuzz/corpus/$name" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ github.sha }}
          path: build/fuzz/findings/
